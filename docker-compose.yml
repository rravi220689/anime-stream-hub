version: '3.8'

services:
  anime-stream-hub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anime-stream-hub
    restart: unless-stopped
    ports:
      - "${PORT:-5050}:5050"
    environment:
      - NODE_ENV=production
      - PORT=5050
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/api/sample-streams"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    resources:
      limits:
        cpus: '1.0'
        memory: 512M
