<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241B42"/>
      <stop offset="60%" stop-color="#151A30"/>
      <stop offset="100%" stop-color="#090D18"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGlow)"/>
  <!-- Outer Shield -->
  <polygon points="32,10 50,20 45,46 32,52 19,46 14,20" fill="#1E293B" stroke="url(#shieldGrad)" stroke-width="1.8"/>
  <!-- 'A' Left Wing Beam -->
  <polygon points="21,21 24,21 20,41 17,41" fill="#00F0FF"/>
  <!-- 'A' Crossbar -->
  <rect x="18" y="32" width="10" height="2.5" fill="#8B5CF6"/>
  <!-- Dual Play Triangle -->
  <polygon points="27,21 44,32 27,32" fill="#00F0FF"/>
  <polygon points="27,32 44,32 27,43" fill="#EC4899"/>
  <!-- Center Play Core -->
  <polygon points="29,27 37,32 29,32" fill="#FFFFFF"/>
  <!-- Anime Sparkle Star -->
  <polygon points="45,13 46,16 49,17 46,18 45,21 44,18 41,17 44,16" fill="#FFB800"/>
</svg>
